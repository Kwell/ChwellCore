# ChwellCore 服务配置文件示例
# 格式：key = value 或 key: value
# 支持 # 和 // 注释

# ========== 服务基础配置 ==========
server_name = "game_server"
bus_id = "8.8.8.1"
listen_port = 9000
worker_threads = 4

# ========== 日志配置 ==========
log_level = "INFO"
log_path = "./logs/"

# ========== 网络配置 ==========
max_connections = 10000
heartbeat_interval = 30

# ========== 组件配置 ==========

# 协议路由组件
component.ProtocolRouter.enabled = true
component.ProtocolRouter.priority = 1

# Session 管理组件
component.SessionManager.enabled = true
component.SessionManager.priority = 2
component.SessionManager.max_sessions = 10000
component.SessionManager.timeout = 300

# 玩家管理组件
component.PlayerManager.enabled = true
component.PlayerManager.priority = 3
component.PlayerManager.max_players = 10000

# 战斗组件
component.BattleManager.enabled = true
component.BattleManager.priority = 4
component.BattleManager.max_battles = 1000

# 排行榜组件
component.RankManager.enabled = true
component.RankManager.priority = 5

# MySQL 数据库组件（可选）
component.Database.enabled = false
component.Database.priority = 10
component.Database.host = "localhost"
component.Database.port = 3306
component.Database.db_name = "game_db"
component.Database.user = "game_user"
component.Database.password = "game_pass"

# Redis 缓存组件（可选）
component.Redis.enabled = false
component.Redis.priority = 11
component.Redis.host = "localhost"
component.Redis.port = 6379
