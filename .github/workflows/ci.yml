name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libssl-dev
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCHWELL_BUILD_EXAMPLES=OFF \
            -DCHWELL_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  asan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libssl-dev
      - name: Configure ASan
        run: |
          cmake -S . -B build-asan \
            -DCHWELL_BUILD_EXAMPLES=OFF \
            -DCHWELL_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build ASan
        run: cmake --build build-asan -j 4
      - name: Run tests ASan
        run: ctest --test-dir build-asan --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libssl-dev
      - name: Configure TSan
        run: |
          cmake -S . -B build-tsan \
            -DCHWELL_BUILD_EXAMPLES=OFF \
            -DCHWELL_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
      - name: Build TSan
        run: cmake --build build-tsan -j 4
      - name: Run tests TSan
        run: ctest --test-dir build-tsan --output-on-failure
