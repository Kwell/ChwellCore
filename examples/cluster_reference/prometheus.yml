global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: chwell-reference
    static_configs:
      - targets: [gateway:9300, gateway-two:9300]
        labels:
          role: gateway
      - targets: [game-one:9300, game-two:9300]
        labels:
          role: game
