# Local reference credentials only. Start from the repository root as documented.
x-role: &role
  image: chwell-cluster-reference:local
  build:
    context: ../..
    dockerfile: examples/cluster_reference/Dockerfile
  init: true
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "cluster_reference", "probe", "9300", "ready"]
    interval: 2s
    timeout: 3s
    retries: 5
    start_period: 15s
  environment: &environment
    CHWELL_DEMO_TOKEN: local-demo-token
    CHWELL_CLUSTER_TOKEN: local-internal-token
    CHWELL_DB_HOST: mysql
    CHWELL_DB_NAME: chwell
    CHWELL_DB_USER: chwell
    CHWELL_DB_PASSWORD: local-db-password
    CHWELL_OPS_PORT: "9300"
    CHWELL_OPS_BIND: "0.0.0.0"
    CHWELL_DRAIN_SECONDS: "15"
  depends_on:
    consul:
      condition: service_healthy
    mysql:
      condition: service_healthy
services:
  consul:
    image: hashicorp/consul:1.20.6
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: chwell
      MYSQL_USER: chwell
      MYSQL_PASSWORD: local-db-password
    volumes:
      - player-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 2s
      timeout: 3s
      retries: 60
  game-one:
    <<: *role
    command: ["game", "http://consul:8500", "game-one", "9201", "v1"]
    environment:
      <<: *environment
      CHWELL_ADVERTISE_HOST: game-one
  game-two:
    <<: *role
    command: ["game", "http://consul:8500", "game-two", "9202", "v1"]
    environment:
      <<: *environment
      CHWELL_ADVERTISE_HOST: game-two
  gateway:
    <<: *role
    command: ["gateway", "http://consul:8500", "9100"]
    ports:
      - "127.0.0.1:9100:9100"
  gateway-two:
    <<: *role
    command: ["gateway", "http://consul:8500", "9100"]
    ports:
      - "127.0.0.1:9101:9100"
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
volumes:
  player-data:
